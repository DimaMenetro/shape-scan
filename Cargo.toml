[package]
name = "shape-scan"
version = "0.1.0"
edition = "2021"
description = "CLI scanner that measures the entropy and topological shape of files to flag suspicious binaries (e.g. packed/encrypted payloads)."
license = "MIT OR Apache-2.0"
repository = "https://github.com/DimaMenetro/shape-scan"
readme = "README.md"
keywords = ["entropy", "malware", "topology", "binary-analysis", "cli"]
categories = ["command-line-utilities", "filesystem"]

[[bin]]
name = "shape-scan"
path = "src/main.rs"

[lib]
name = "shape_scan"
path = "src/lib.rs"

[dependencies]
anyhow = "1.0"
clap = { version = "4.5", features = ["derive"] }
goblin = { version = "0.8", default-features = false, features = ["std", "elf32", "elf64", "pe32", "pe64", "mach32", "mach64", "endian_fd"] }
rayon = "1.10"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "1"
walkdir = "2.5"

[dev-dependencies]
tempfile = "3.10"

[profile.release]
lto = "thin"
codegen-units = 1
strip = "symbols"
