[workspace]
members = [".", "src-tauri"]
resolver = "2"

[package]
name = "shape-scan"
version = "2.0.0-alpha"
edition = "2021"
description = "Geometric threat analysis — measures the mathematical shape of files to detect malware through topology, entropy, and intent."
license = "MIT OR Apache-2.0"
authors = ["DimaMenetro"]

[[bin]]
name = "shape-scan"
path = "src/main.rs"

[lib]
name = "shape_scan"
path = "src/lib.rs"

[dependencies]
# Binary parsing (PE, ELF, Mach-O)
goblin = "0.9"

# CLI argument parsing
clap = { version = "4", features = ["derive"] }

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Hashing
sha2 = "0.10"

# Parallel iteration for directory scanning
rayon = "1"

# Compression ratio measurement (TFEA Extension)
flate2 = "1"

[profile.release]
opt-level = 3
lto = true
strip = true
