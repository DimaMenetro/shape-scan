name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -Dwarnings

jobs:
  engine:
    name: shape-scan engine (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: ". -> target"
      - name: cargo fmt
        run: cargo fmt -p shape-scan -- --check
      - name: cargo clippy
        run: cargo clippy -p shape-scan --all-targets --all-features -- -D warnings
      - name: cargo test
        run: cargo test -p shape-scan --all-features --verbose
      - name: cargo build (release)
        run: cargo build -p shape-scan --release --verbose
